name: Safety evals

# Runs the model evals (single replies, safety labels, and whole-conversation scenarios)
# whenever Haven's instructions or AI code change. Needs a GEMINI_API_KEY (or
# ANTHROPIC_API_KEY) repository secret; without one the evals are skipped.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/lib/prompts/**"
      - "src/lib/llm/**"
      - "src/lib/safety/**"
      - "evals/**"

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_CONCURRENCY: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/results/
          if-no-files-found: ignore
