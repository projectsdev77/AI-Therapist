<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(64px - 3.3cqw) clamp(16px,3cqw,40px) 0;position:relative;z-index:2">
<div style="display:flex;align-items:center;gap:12px;min-width:0">
<sc-if value="{{ back }}" hint-placeholder-val="{{ false }}">
<button aria-label="Back" style="width:44px;height:44px;margin-left:-10px;border-radius:50%;border:0;background:transparent;color:var(--color-text);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
</sc-if>
<a href="#" aria-label="Haven home" style="display:flex;align-items:center;gap:8px;min-height:44px;color:var(--color-text);text-decoration:none">
<svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--tone-neutral)" opacity=".35"></circle><circle cx="15" cy="15.5" r="11" fill="var(--tone-neutral)" opacity=".6"></circle><circle cx="14.5" cy="14.5" r="6.5" fill="var(--orb-core)"></circle></svg>
<span style="font-family:var(--font-accent);font-style:italic;font-size:27px;line-height:1;letter-spacing:-.01em">haven</span>
</a>
</div>
<div style="display:flex;gap:6px;align-items:center;flex:none">
<button style="min-height:44px;padding:0 18px;border-radius:var(--radius-pill);border:0;background:var(--color-care-surface);color:var(--color-care);font:500 15px var(--font-body)">Get help</button>
<button aria-label="Menu" style="width:44px;height:44px;border-radius:50%;border:0;background:var(--color-surface);color:var(--color-text);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 9h14M5 15h14"></path></svg></button>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:110},&quot;back&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}"></script>
</body>
</html>
