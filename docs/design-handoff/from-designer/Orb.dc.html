<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<canvas ref="{{ cv }}" role="img" aria-label="{{ label }}" data-presence-state="{{ state }}" style="width:100%;height:100%;display:block"></canvas>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:300},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;listening&quot;,&quot;thinking&quot;,&quot;speaking&quot;,&quot;concerned&quot;,&quot;breath&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;neutral&quot;,&quot;calm&quot;,&quot;heavy&quot;,&quot;anxious&quot;,&quot;warm&quot;,&quot;hopeful&quot;,&quot;frustrated&quot;],&quot;default&quot;:&quot;neutral&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const PRESENCE_STATES = {
  idle:      { scale: 1.00, wobble: 0.050, swirl: 0.60, ripple: 0.0, glow: 1.00, breathAmp: 0.035, breathPeriod: 10, spread: 1.00, levelGain: 0.0 },
  listening: { scale: 1.04, wobble: 0.060, swirl: 0.70, ripple: 0.8, glow: 1.10, breathAmp: 0.015, breathPeriod: 10, spread: 1.08, levelGain: 0.9 },
  thinking:  { scale: 0.92, wobble: 0.035, swirl: 1.60, ripple: 0.0, glow: 0.90, breathAmp: 0.020, breathPeriod: 6,  spread: 0.90, levelGain: 0.0 },
  speaking:  { scale: 1.02, wobble: 0.055, swirl: 0.80, ripple: 0.6, glow: 1.15, breathAmp: 0.010, breathPeriod: 10, spread: 1.10, levelGain: 1.0 },
  concerned: { scale: 0.97, wobble: 0.020, swirl: 0.30, ripple: 0.0, glow: 1.20, breathAmp: 0.030, breathPeriod: 12, spread: 1.15, levelGain: 0.3 },
  breath:    { scale: 1.00, wobble: 0.025, swirl: 0.40, ripple: 0.0, glow: 1.05, breathAmp: 0.000, breathPeriod: 10, spread: 1.05, levelGain: 0.0 },
};
const LABELS = { idle: 'resting', listening: 'listening', thinking: 'thinking', speaking: 'speaking', concerned: 'here with you', breath: 'breathing with you' };
class Component extends DCLogic {
  cv = React.createRef();
  componentDidMount() {
    this.reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.p = { ...PRESENCE_STATES[this.props.state || 'idle'] };
    this.lv = 0; this.t0 = performance.now(); this.last = this.t0; this.visible = true;
    this.io = new IntersectionObserver((e) => { this.visible = e[0].isIntersecting; });
    if (this.cv.current) this.io.observe(this.cv.current);
    const loop = (now) => { if (this.visible || !this.drawn) this.frame(now); this.drawn = true; if (!this.reduce) this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
    [60, 400, 1200].forEach((ms) => setTimeout(() => this.frame(performance.now()), ms));
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); this.io && this.io.disconnect(); }
  col(cs, name, fb) { const v = cs.getPropertyValue(name).trim(); return v || fb; }
  rgba(h, a) { const n = parseInt(h.replace('#', ''), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${Math.max(0, Math.min(1, a))})`; }
  blob(ctx, cx, cy, R, t, wob, ph, rip, lv) {
    ctx.beginPath();
    for (let i = 0; i <= 96; i++) {
      const a = (i / 96) * Math.PI * 2;
      const n = (Math.sin(3 * a + t * 0.7 + ph) + 0.6 * Math.sin(5 * a - t * 0.9 + ph * 2) + 0.35 * Math.sin(8 * a + t * 1.3 + ph)) / 1.95;
      const r = R * (1 + wob * n + rip * lv * 0.02 * Math.sin(11 * a - t * 5 + ph));
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
  }
  frame(now) {
    const cv = this.cv.current; if (!cv) return;
    const s = cv.clientWidth; if (!s) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1), W = Math.round(s * dpr);
    if (cv.width !== W || cv.height !== W) { cv.width = W; cv.height = W; }
    const dt = Math.min((now - this.last) / 1000, 0.1); this.last = now;
    const t = this.reduce ? 0 : (now - this.t0) / 1000;
    const st = this.props.state || 'idle', target = PRESENCE_STATES[st] || PRESENCE_STATES.idle;
    const k = 1 - Math.exp(-dt * 2.5);
    Object.keys(target).forEach((key) => { this.p[key] += (target[key] - this.p[key]) * k; });
    const p = this.p;
    let raw = 0;
    if (!this.reduce && p.levelGain > 0.01) raw = Math.max(0, Math.min(1, 0.45 * Math.sin(t * 2.3) + 0.3 * Math.sin(t * 5.1 + 1) + 0.35 * Math.sin(t * 0.6) + 0.15)) * p.levelGain;
    this.lv += (raw - this.lv) * (raw > this.lv ? 1 - Math.exp(-dt * 18) : 1 - Math.exp(-dt * 4));
    const lv = this.lv;
    let bs;
    if (st === 'breath') { const b = this.reduce ? 0.5 : 0.5 - 0.5 * Math.cos((t * Math.PI * 2) / 10); bs = 0.78 + 0.38 * b; }
    else bs = 1 + (this.reduce ? 0 : p.breathAmp * Math.sin((2 * Math.PI * t) / p.breathPeriod));
    const cs = getComputedStyle(cv);
    const toneName = st === 'concerned' ? 'concerned' : (this.props.tone || 'neutral');
    const tone = this.col(cs, '--tone-' + toneName, '#86c793');
    const core = this.col(cs, '--orb-core', '#cfe6b8'), mem = this.col(cs, '--orb-membrane', '#a9c98a');
    const ga = parseFloat(this.col(cs, '--orb-glow-alpha', '0.1')), blend = this.col(cs, '--orb-blend', 'screen');
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, s, s);
    const cx = s / 2, cy = s / 2, R = s * 0.27 * p.scale * bs * (1 + 0.05 * lv);
    ctx.globalCompositeOperation = 'source-over';
    let g = ctx.createRadialGradient(cx, cy, R * 0.4, cx, cy, s / 2);
    g.addColorStop(0, this.rgba(tone, ga * p.glow * (1 + 0.5 * lv))); g.addColorStop(1, this.rgba(tone, 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
    if (this.reduce) {
      g = ctx.createRadialGradient(cx - R * 0.2, cy - R * 0.2, 0, cx, cy, R * 1.15);
      g.addColorStop(0, this.rgba(core, 1)); g.addColorStop(0.5, this.rgba(tone, 0.9)); g.addColorStop(1, this.rgba(mem, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 1.15, 0, 7); ctx.fill(); return;
    }
    ctx.globalCompositeOperation = blend;
    const sw = p.swirl;
    [[1.22 * p.spread, mem, 0.22, 0], [1.08 * p.spread, tone, 0.38, 2.1], [0.94, tone, 0.55, 4.3]].forEach(([kk, c, al, ph]) => {
      this.blob(ctx, cx, cy, R * kk, t * sw * (1 + ph * 0.08), p.wobble + lv * 0.04, ph, p.ripple, lv);
      ctx.fillStyle = this.rgba(c, al); ctx.fill();
    });
    ctx.globalCompositeOperation = 'source-over';
    g = ctx.createRadialGradient(cx - R * 0.12, cy - R * 0.15, 0, cx, cy, R * 0.85);
    g.addColorStop(0, this.rgba(core, 0.95)); g.addColorStop(0.35, this.rgba(core, 0.55)); g.addColorStop(1, this.rgba(tone, 0));
    this.blob(ctx, cx, cy, R * 0.85, t * sw * 1.2, p.wobble * 0.8, 1.3, 0, lv); ctx.fillStyle = g; ctx.fill();
  }
  renderVals() {
    const st = this.props.state || 'idle';
    return { cv: this.cv, state: st, label: 'Companion is ' + (LABELS[st] || 'resting') };
  }
}
</script>
</body>
</html>
