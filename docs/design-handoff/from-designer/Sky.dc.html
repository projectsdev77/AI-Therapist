<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<canvas ref="{{ cv }}" aria-hidden="true" data-weather="{{ weather }}" style="position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--color-bg)"></canvas>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:400},&quot;weather&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;clear&quot;,&quot;haze&quot;,&quot;drizzle&quot;,&quot;storm&quot;,&quot;breaking&quot;,&quot;unknown&quot;],&quot;default&quot;:&quot;unknown&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;tile&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  cv = React.createRef();
  componentDidMount() {
    this.reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.t0 = performance.now(); this.visible = true;
    this.io = new IntersectionObserver((e) => { this.visible = e[0].isIntersecting; });
    this.cv.current && this.io.observe(this.cv.current);
    const still = this.props.variant === 'tile' || this.reduce;
    const loop = (now) => { if (this.visible || !this.drawn) { this.draw(now); this.drawn = true; } if (!still) this.raf = requestAnimationFrame(loop); };
    this.raf = requestAnimationFrame(loop);
    this.to = [60, 400, 1200].map((ms) => setTimeout(() => this.draw(performance.now()), ms));
  }
  componentDidUpdate() { if (this.reduce || this.props.variant === 'tile') this.draw(performance.now()); }
  componentWillUnmount() { cancelAnimationFrame(this.raf); this.io && this.io.disconnect(); }
  rand(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  glow(ctx, x, y, r, c0, w, h) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c0); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); }
  cloud(ctx, x, y, r, rgb, a) {
    for (let k = 0; k < 4; k++) {
      const cx = x + (k - 1.5) * r * 0.55, cy = y + Math.sin(k * 1.7) * r * 0.12, rr = r * (0.55 + 0.18 * Math.cos(k * 2.1));
      this.soft(ctx, cx, cy, rr, rr * 0.5, rgb, a);
    }
  }
  soft(ctx, x, y, rx, ry, rgb, a) {
    ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(0.5, `rgba(${rgb},${a * 0.5})`); g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.fillRect(-rx, -rx, rx * 2, rx * 2); ctx.restore();
  }
  rays(ctx, x, y, len, n, spread, rgb, a) {
    ctx.save(); ctx.translate(x, y);
    for (let i = 0; i < n; i++) {
      const ang = -Math.PI / 2 + (i - (n - 1) / 2) * spread;
      const g = ctx.createLinearGradient(0, 0, Math.cos(ang) * len, Math.sin(ang) * len);
      g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ang - 0.05) * len, Math.sin(ang - 0.05) * len);
      ctx.lineTo(Math.cos(ang + 0.05) * len, Math.sin(ang + 0.05) * len); ctx.fill();
    }
    ctx.restore();
  }
  draw(now) {
    const cv = this.cv.current; if (!cv) return;
    const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const cs = getComputedStyle(cv), W = this.props.weather || 'unknown';
    const v = (n, f) => cs.getPropertyValue(n).trim() || f;
    const top = v('--sky-' + W + '-top', '#181a16'), bot = v('--sky-' + W + '-bottom', '#181a16');
    const skyGlow = v('--sky-glow', 'rgba(200,230,160,.16)');
    const dark = cs.getPropertyValue('color-scheme').trim() !== 'light';
    const t = this.reduce ? 0 : (now - this.t0) / 1000;
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    let g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, top); g.addColorStop(1, bot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const s = Math.min(w, h), L = Math.max(w, h), full = this.props.variant !== 'tile';
    if (dark) {
      if (W === 'clear' || W === 'unknown') {
        this.glow(ctx, w * 0.75, h * 0.12, s * 0.7, skyGlow, w, h);
        const n = W === 'clear' ? 46 : 18;
        for (let i = 0; i < n; i++) {
          const x = this.rand(i) * w, y = this.rand(i + 99) * h * 0.6, tw = 0.5 + 0.5 * Math.sin(t * 0.6 + i * 1.7);
          ctx.fillStyle = `rgba(244,246,232,${0.25 + 0.45 * tw})`;
          ctx.beginPath(); ctx.arc(x, y, (0.6 + this.rand(i + 7) * 1.1) * (s > 200 ? 1 : 0.7), 0, 7); ctx.fill();
        }
      } else if (W === 'haze') {
        for (let i = 0; i < 5; i++) {
          const x = ((this.rand(i) * 1.4 - 0.2) * w + t * (6 + i * 2)) % (w * 1.4) - w * 0.2;
          this.glow(ctx, x, h * (0.15 + i * 0.16), s * 0.55, 'rgba(220,215,190,.05)', w, h);
        }
      } else if (W === 'breaking') {
        const rise = this.reduce ? 0.5 : 0.5 + 0.5 * Math.sin(t * 0.15);
        this.glow(ctx, w * 0.5, h * (1.02 - rise * 0.06), L * 0.8, 'rgba(240,190,120,.06)', w, h);
        this.rays(ctx, w * 0.5, h * 1.02, h * 1.1, 7, 0.22, '240,200,140', 0.025);
      }
    } else {
      if (W === 'clear') {
        const sx = w * 0.8, sy = h * 0.2;
        this.glow(ctx, w * 0.1, 0, L * 0.7, 'rgba(196,222,232,.6)', w, h);
        this.glow(ctx, sx, sy, L * 0.8, 'rgba(255,236,196,.85)', w, h);
        this.glow(ctx, sx, sy, s * 0.22, 'rgba(255,250,232,.95)', w, h);
        ctx.fillStyle = 'rgba(255,253,244,.95)'; ctx.beginPath(); ctx.arc(sx, sy, Math.max(6, s * 0.055), 0, 7); ctx.fill();
        ctx.lineCap = 'round';
        for (let i = 0; i < 3; i++) {
          const y = h * (0.12 + i * 0.13), x0 = ((t * (4 + i) + this.rand(i + 20) * w) % (w * 1.6)) - w * 0.6;
          const gg = ctx.createLinearGradient(x0, 0, x0 + w * 0.7, 0);
          gg.addColorStop(0, 'rgba(255,255,255,0)'); gg.addColorStop(0.5, 'rgba(255,255,255,.5)'); gg.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.strokeStyle = gg; ctx.lineWidth = Math.max(3, s * 0.02); ctx.filter = 'blur(' + Math.max(1.5, s * 0.008) + 'px)';
          ctx.beginPath(); ctx.moveTo(x0, y); ctx.quadraticCurveTo(x0 + w * 0.35, y - s * 0.03, x0 + w * 0.7, y + s * 0.01); ctx.stroke();
        }
        ctx.filter = 'none';
      } else if (W === 'unknown') {
        this.glow(ctx, w * 0.22, h * 0.3, L * 0.6, 'rgba(255,252,240,.8)', w, h);
        this.glow(ctx, w * 0.9, h * 0.05, L * 0.5, 'rgba(214,226,232,.55)', w, h);
        ctx.fillStyle = 'rgba(255,255,252,.75)'; ctx.beginPath(); ctx.arc(w * 0.22, h * 0.3, Math.max(5, s * 0.045), 0, 7); ctx.fill();
        for (let i = 0; i < 2; i++) {
          const y = h * (0.5 + i * 0.16), off = (t * (3 + i * 2)) % w;
          for (let k = -1; k < 2; k++) {
            this.soft(ctx, off + k * w, y, w * 0.7, s * 0.12, '255,255,255', 0.55);
          }
        }
      } else if (W === 'haze') {
        for (let i = 0; i < 5; i++) {
          const x = ((this.rand(i) * 1.4 - 0.2) * w + t * (6 + i * 2)) % (w * 1.4) - w * 0.2;
          this.glow(ctx, x, h * (0.15 + i * 0.16), s * 0.55, 'rgba(255,252,240,.55)', w, h);
        }
      } else if (W === 'breaking') {
        const rise = this.reduce ? 0.5 : 0.5 + 0.5 * Math.sin(t * 0.15);
        const hx = w * 0.5, hy = h * 1.0;
        this.glow(ctx, hx, hy, L * 0.85, 'rgba(255,206,150,.55)', w, h);
        this.rays(ctx, hx, hy, h * 0.95, 7, 0.21, '255,250,236', 0.28);
        this.glow(ctx, hx, hy - s * 0.02 * rise, s * 0.35, 'rgba(255,246,225,.95)', w, h);
        const drift = t * 3;
        [[0.12, 0.1, 0.32], [0.62, 0.06, 0.38], [0.92, 0.2, 0.26], [0.35, 0.24, 0.22]].forEach(([fx, fy, fr], i) => {
          const x = ((fx * w + drift * (i % 2 ? -1 : 1)) % (w * 1.2) + w * 1.2) % (w * 1.2) - w * 0.1;
          this.cloud(ctx, x, fy * h + fr * L * 0.08, fr * L, '160,170,162', 0.22);
          this.cloud(ctx, x, fy * h, fr * L * 0.9, '255,255,252', 0.6);
        });
      }
    }
    if (W === 'drizzle' || W === 'storm') {
      const n = W === 'storm' ? 120 : 50, len = W === 'storm' ? 22 : 14;
      if (W === 'storm') { g = ctx.createLinearGradient(0, 0, 0, h * 0.5); g.addColorStop(0, dark ? 'rgba(0,0,0,.25)' : 'rgba(80,90,80,.10)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); }
      ctx.lineWidth = 1; ctx.lineCap = 'round';
      for (let i = 0; i < n; i++) {
        const sp = 40 + this.rand(i + 3) * 40, x = this.rand(i) * w * 1.1, y = ((this.rand(i + 50) * h + t * sp) % (h + len)) - len;
        const safe = full ? 1 - 0.88 * Math.min(1, Math.max(0, (y / h - 0.45) / 0.15)) : 1;
        ctx.strokeStyle = `rgba(${dark ? '200,215,205' : '70,95,85'},${((dark ? 0.12 : 0.14) + this.rand(i + 9) * 0.14) * safe})`;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - len * 0.18, y + len * (s > 200 ? 1 : 0.5)); ctx.stroke();
      }
    }
  }
  renderVals() { return { cv: this.cv, weather: this.props.weather || 'unknown' }; }
}
</script>
</body>
</html>
